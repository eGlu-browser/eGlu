# The Rust the engines build with: the newest stable of 2026-10-25, and every
# Apple target build.sh makes a slice of the XCFramework from.
[toolchain]
channel = "1.99.1"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
]
