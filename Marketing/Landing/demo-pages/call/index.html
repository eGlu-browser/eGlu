<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design review · Mossgrove</title>
<link rel="icon" type="image/png" sizes="180x180" href="touch-icon.png">
<link rel="apple-touch-icon" href="touch-icon.png">
<style>
  /* A made-up team call, for showing document picture-in-picture: its people move into the
     window the browser opens, as a video call's do, and come back when it closes. */
  :root { --bg: #15171a; --panel: #1f2226; --ink: #eef0f2; --soft: #a3aab3; --ring: #6fcf97; --red: #e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  header strong { font-weight: 600; }
  header span { color: var(--soft); }
  main { flex: 1; display: flex; padding: 0 20px; min-height: 0; }
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
  .tile { position: relative; border-radius: 14px; overflow: hidden; background: #000; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name { position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 999px; background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tile .name svg { width: 12px; height: 12px; }
  .tile.speaking { box-shadow: inset 0 0 0 3px var(--ring); }
  .tile.speaking::after { content: ""; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 3px var(--ring); pointer-events: none; }
  .away { flex: 1; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: var(--soft); }
  .away button { padding: 10px 18px; border-radius: 999px; border: 0; background: var(--panel); color: var(--ink); font: 600 14px/1 inherit; }
  body.popped .grid { display: none; }
  body.popped .away { display: flex; }
  footer { display: flex; justify-content: center; gap: 12px; padding: 16px 20px 20px; }
  .ctl { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); display: grid; place-items: center; }
  .ctl svg { width: 20px; height: 20px; }
  .ctl.leave { width: 64px; border-radius: 24px; background: var(--red); }
  .ctl.pop { width: auto; padding: 0 16px; border-radius: 24px; gap: 8px; display: flex; align-items: center; font: 600 14px/1 inherit; }
  /* In the picture-in-picture window: the person speaking large, the others in a row, the controls under them. */
  .pip body, body.pip { background: var(--bg); }
  .pip-wrap { display: flex; flex-direction: column; height: 100vh; padding: 8px; gap: 8px; }
  .pip-wrap .grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr auto; }
  .pip-wrap .tile:first-child { grid-column: 1 / -1; }
  .pip-wrap .tile:not(:first-child) { aspect-ratio: 3 / 2; }
  .pip-wrap .tile .name { font-size: 11px; left: 6px; bottom: 6px; padding: 2px 7px; }
  .pip-wrap footer { padding: 0 0 2px; gap: 8px; }
  .pip-wrap .ctl { width: 36px; height: 36px; }
  .pip-wrap .ctl svg { width: 16px; height: 16px; }
  .pip-wrap .ctl.leave { width: 48px; }
  .pip-wrap .ctl.pop { display: none; }
</style>
</head>
<body>
<header><span class="dot"></span><strong>Design review</strong><span>Mossgrove · 24:18</span></header>
<main>
  <div class="grid" id="grid">
    <div class="tile speaking"><img src="minstrel.jpg" alt=""><div class="name"><svg viewBox="0 0 12 12"><rect x="4" y="1" width="4" height="7" rx="2" fill="#6fcf97"/><path d="M2 6a4 4 0 0 0 8 0M6 10v1.5" stroke="#6fcf97" fill="none" stroke-width="1.2"/></svg>Bertrand the Minstrel</div></div>
    <div class="tile"><img src="alien.jpg" alt=""><div class="name">Zorblax</div></div>
    <div class="tile"><img src="hal.jpg" alt=""><div class="name">Hal</div></div>
    <div class="tile"><img src="p1.jpg" alt=""><div class="name">You</div></div>
  </div>
  <div class="away"><span>The call is in a picture-in-picture window.</span><button id="back">Bring it back</button></div>
</main>
<footer id="controls">
  <button class="ctl" aria-label="Mute"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4 9.5a6 6 0 0 0 12 0M10 15.5V18"/></svg></button>
  <button class="ctl" aria-label="Camera"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="11" height="10" rx="2.5"/><path d="M13.5 9l4-2.5v7l-4-2.5"/></svg></button>
  <button class="ctl pop" id="pop" aria-label="Pop out"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" width="18" height="18"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><rect x="9.5" y="9.5" width="6" height="5" rx="1.2" fill="currentColor" stroke="none"/></svg>Pop out</button>
  <button class="ctl leave" aria-label="Leave"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5c4-3.5 10-3.5 14 0l-1.8 2-3-1.2v-2.1a9 9 0 0 0-4.4 0v2.1l-3 1.2z" fill="currentColor"/></svg></button>
</footer>
<script>
  // Document picture-in-picture, as a video call uses it: the people and the controls move into
  // the window the browser opens, and come back to the page when it closes.
  const grid = document.getElementById('grid');
  const controls = document.getElementById('controls');
  const main = document.querySelector('main');
  let pip = null;

  async function popOut() {
    if (!('documentPictureInPicture' in window) || pip) return;
    pip = await documentPictureInPicture.requestWindow({ width: 380, height: 330 });
    // The page's styles go with its elements.
    for (const sheet of document.styleSheets) {
      const style = pip.document.createElement('style');
      style.textContent = [...sheet.cssRules].map((r) => r.cssText).join('\n');
      pip.document.head.append(style);
    }
    pip.document.body.className = 'pip';
    const wrap = pip.document.createElement('div');
    wrap.className = 'pip-wrap';
    wrap.append(grid, controls);
    pip.document.body.append(wrap);
    document.body.classList.add('popped');
    pip.addEventListener('pagehide', () => {
      main.prepend(grid);
      document.body.append(controls);
      document.body.classList.remove('popped');
      pip = null;
    });
  }

  document.getElementById('pop').addEventListener('click', popOut);
  document.getElementById('back').addEventListener('click', () => pip && pip.close());
  // Mid-call, leaving the tab moves the call to its own window, as video calls do.
  try { navigator.mediaSession.setActionHandler('enterpictureinpicture', popOut); } catch (e) {}
</script>
</body>
</html>
