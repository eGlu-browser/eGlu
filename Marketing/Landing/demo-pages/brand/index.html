<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand · Mossgrove</title>
<link rel="icon" type="image/png" sizes="180x180" href="../jobs/mossgrove/touch-icon.png">
<link rel="apple-touch-icon" href="../jobs/mossgrove/touch-icon.png">
<style>
  /* A made-up company's brand page, for a Peek: its mark, its colours and its type. */
  :root { --ink: #16181b; --soft: #5f6670; --line: #e4e6ea; --bg: #fbfbfa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 32px 64px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .top svg { width: 34px; height: 34px; }
  .top b { font-size: 18px; letter-spacing: -0.01em; }
  .top span { color: var(--soft); margin-left: auto; font-size: 13px; }
  h1 { font-size: 40px; line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 10px; }
  .lede { color: var(--soft); margin: 0 0 32px; max-width: 46ch; }
  h2 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); margin: 34px 0 14px; font-weight: 600; }
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mark { border-radius: 14px; height: 150px; display: grid; place-items: center; }
  .mark svg { width: 72px; height: 72px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .sw i { display: block; height: 84px; }
  .sw div { padding: 8px 10px 10px; font-size: 12px; }
  .sw div b { display: block; font-size: 13px; }
  .sw div span { color: var(--soft); font-variant-numeric: tabular-nums; }
  .type { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 22px 24px; }
  .type .big { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .type p { margin: 10px 0 0; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f5c46"/><path d="M9 22c0-6 3-11 7-13 4 2 7 7 7 13" fill="none" stroke="#e9f2ec" stroke-width="2.6" stroke-linecap="round"/><path d="M16 9v14" stroke="#e9f2ec" stroke-width="2.6" stroke-linecap="round"/></svg>
    <b>Mossgrove</b><span>Brand · v3</span>
  </div>
  <h1>The brand, in one page</h1>
  <p class="lede">The mark, the four colours and the one typeface we use everywhere: in the product, on posters, at events.</p>

  <h2>Mark</h2>
  <div class="marks">
    <div class="mark" style="background:#1f5c46"><svg viewBox="0 0 32 32"><path d="M9 22c0-6 3-11 7-13 4 2 7 7 7 13" fill="none" stroke="#e9f2ec" stroke-width="2.6" stroke-linecap="round"/><path d="M16 9v14" stroke="#e9f2ec" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div class="mark" style="background:#ffffff;border:1px solid #e4e6ea"><svg viewBox="0 0 32 32"><path d="M9 22c0-6 3-11 7-13 4 2 7 7 7 13" fill="none" stroke="#1f5c46" stroke-width="2.6" stroke-linecap="round"/><path d="M16 9v14" stroke="#1f5c46" stroke-width="2.6" stroke-linecap="round"/></svg></div>
  </div>

  <h2>Colour</h2>
  <div class="swatches">
    <div class="sw"><i style="background:#1f5c46"></i><div><b>Forest</b><span>#1F5C46</span></div></div>
    <div class="sw"><i style="background:#3d9be9"></i><div><b>Sky</b><span>#3D9BE9</span></div></div>
    <div class="sw"><i style="background:#f0a24a"></i><div><b>Ember</b><span>#F0A24A</span></div></div>
    <div class="sw"><i style="background:#14161a"></i><div><b>Night</b><span>#14161A</span></div></div>
  </div>

  <h2>Type</h2>
  <div class="type"><div class="big">Launch week</div><p>Headlines heavy and tight; text at 15 points, set as it reads.</p></div>
</div>
</body>
</html>
