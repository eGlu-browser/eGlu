# Safience's Xcode project, made from this file with XcodeGen
# (https://github.com/yonaskolb/XcodeGen): run `xcodegen` in this folder after
# adding or removing a file. Safience.xcodeproj is committed as generated, so
# building needs nothing but Xcode.
name: Safience
options:
  deploymentTarget:
    iOS: "17.0"
    # The Mac app is drawn in Liquid Glass throughout, which macOS has from 26.
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # Swift 6's language mode adds strict concurrency checking, which buys
    # nothing in an app that is main-thread by nature.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "31"
packages:
  PadCore:
    path: PadCore
targets:
  Safience:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App
    dependencies:
      - package: PadCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # App/Safience.icon, made with Icon Composer: Liquid Glass on iOS and
        # iPadOS 26 and later; Xcode draws flat pictures from it for earlier ones.
        ASSETCATALOG_COMPILER_APPICON_NAME: Safience
        # The icons Settings › App icon offers, each an Icon Composer file in App/.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Astro Designer Engineer Hardcover Punk Signal Vista
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        # Apple Intelligence's on-device model (Intelligence.swift) is iOS 26's;
        # linked weakly, the app still starts without it on iOS 17 and 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
  # Safience for Mac: the same spaces, pinned tabs and blocking, in a window
  # with Arc's sidebar down its side and the page beside it. Its own sources
  # in Mac/, with the few of the iPad's that are WebKit and Foundation only.
  Safience Mac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    sources:
      - path: Mac
      - path: App/Sources/ContentBlocker.swift
      - path: App/Sources/SiteIcons.swift
      - path: App/Sources/Stores.swift
      - path: App/Sources/HandingOff.swift
      - path: App/Sources/PageMind.swift
      - path: App/Sources/Sync.swift
      - path: App/Sources/Feather.swift
      - path: App/Sources/SVGRaster.swift
      - path: App/Safience.icon
    dependencies:
      - package: PadCore
    settings:
      base:
        PRODUCT_NAME: Safience
        PRODUCT_MODULE_NAME: SafienceMac
        INFOPLIST_FILE: Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Safience
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Safience:
    build:
      targets:
        Safience: all
    run:
      config: Debug
    archive:
      config: Release
  Safience Mac:
    build:
      targets:
        Safience Mac: all
    run:
      config: Debug
    archive:
      config: Release
