include:
  - ../../project.yml
name: eGluCrashTests
targets:
  eGlu:
    settings:
      base:
        INFOPLIST_FILE: ../../App/Info.plist
  CrashRegressionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CrashRegressionTests.swift
    dependencies:
      - target: eGlu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.taehee.safience.crash-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CrashRegression:
    build:
      targets:
        eGlu: all
        CrashRegressionTests: [test]
    test:
      targets: [CrashRegressionTests]
      parallelizable: false
