<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A page for Tests/handoff.html: a tool in use, scrolled to its second column when it is read. -->
<title>Harbour works: Board</title>
<link rel="canonical" href="https://board.example/b/harbour-works">
<meta name="application-name" content="Board">
</head>
<body>
<div role="toolbar"><button>New card</button> <button>Filter</button> <button>Sort</button> <input type="search" aria-label="Search cards"></div>
<main>
  <h1>Harbour works</h1>
  <section>
    <h2>To do</h2>
    <ul>
      <li>Repaint the tide gauge</li>
      <li>Order chain for the east mooring</li>
      <li>Print next year's tables</li>
    </ul>
    <button>Add a card</button>
  </section>
  <!-- A window's height and more between the columns, so that which of them shows does not hang on the fonts. -->
  <div style="height: 3000px"></div>
  <section>
    <h2 data-scroll>Doing</h2>
    <ul>
      <li>Dredge the inner basin, due 14 March</li>
      <li>Replace the lamp on the slip</li>
    </ul>
    <button>Add a card</button>
  </section>
  <div style="height: 3000px"></div>
  <section>
    <h2>Done</h2>
    <ul>
      <li>Survey the west wall</li>
      <li>Mend the office door</li>
    </ul>
    <button>Add a card</button>
  </section>
</main>
</body>
</html>
