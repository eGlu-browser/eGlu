<!doctype html>
<meta charset="utf-8">
<title>Hands off</title>
<!-- Loaded by bridge.html: this page's own host is made a hands-off host,
     and the bridge has to leave it exactly as it found it. -->
<script>
  window.__messages = [];
  window.webkit = { messageHandlers: { eglu: { postMessage: (m) => window.__messages.push(m) } } };
  window.__egluConfig = { adapter: 'test', css: 'html { --eglu-test: 1 }', handsOff: [location.hostname] };
</script>
<script src="load-bridge.js"></script>
<script>window.__bridgeReady.then(() => { window.__ready = true; });</script>
