# Secret scanning for Safience: gitleaks' own rules. Run before each commit
# (see CONTRIBUTING.md) and on the whole history with `gitleaks git`.

[extend]
useDefault = true

[allowlist]
description = "Not secrets"
paths = [
  # EasyList and EasyPrivacy, copied unchanged: their headers carry upstream git commit hashes.
  '''PadCore/Sources/PadCore/Filters/.*\.txt''',
]
regexes = [
  # The Chrome extension's public key (manifest.json "key"), which fixes its extension ID. The private half is never in this repository.
  '''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA''',
]
